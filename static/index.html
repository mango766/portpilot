<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>PortPilot · 本机服务总览</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            ink: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' },
          },
          animation: {
            'pulse-soft': 'pulse-soft 2.4s ease-in-out infinite',
            'fade-in': 'fade-in 0.4s ease-out',
          },
          keyframes: {
            'pulse-soft': {
              '0%,100%': { opacity: 1, transform: 'scale(1)' },
              '50%': { opacity: 0.65, transform: 'scale(0.92)' },
            },
            'fade-in': {
              '0%': { opacity: 0, transform: 'translateY(4px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>
  <style>
    /* Base background — soft gradient that adapts to dark mode. */
    body {
      background:
        radial-gradient(at 20% 0%, rgba(99,102,241,0.08), transparent 50%),
        radial-gradient(at 80% 100%, rgba(168,85,247,0.08), transparent 50%),
        #f8fafc;
      min-height: 100vh;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(at 20% 0%, rgba(99,102,241,0.18), transparent 50%),
          radial-gradient(at 80% 100%, rgba(168,85,247,0.14), transparent 50%),
          #020617;
      }
    }
    /* Glassmorphism card */
    .card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226,232,240,0.8);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px -12px rgba(15,23,42,0.18);
      border-color: rgba(99,102,241,0.4);
    }
    @media (prefers-color-scheme: dark) {
      .card {
        background: rgba(15,23,42,0.6);
        border-color: rgba(51,65,85,0.6);
      }
      .card:hover {
        border-color: rgba(129,140,248,0.5);
        box-shadow: 0 12px 32px -12px rgba(0,0,0,0.6);
      }
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 9999px; flex-shrink: 0;
    }
    .status-running   { background:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,0.18); }
    .status-non-http  { background:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,0.18); }
    .status-unreachable{ background:#ef4444; box-shadow:0 0 0 3px rgba(239,68,68,0.18); }
    .status-unknown   { background:#94a3b8; box-shadow:0 0 0 3px rgba(148,163,184,0.18); }

    /* Hide native focus ring on mouse but keep for keyboard. */
    :focus:not(:focus-visible) { outline: none; }
  </style>
</head>
<body class="font-sans text-ink-800 dark:text-ink-100 antialiased">
  <div x-data="dashboard()" x-init="init()" class="max-w-7xl mx-auto px-6 py-8 lg:py-12">

    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-500/30">
          ⚓
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent dark:from-indigo-400 dark:to-purple-400">
            PortPilot · 端口领航
          </h1>
          <p class="text-sm text-ink-500 dark:text-ink-400">
            本机所有运行中的服务，一目了然
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative">
          <input
            x-model="query"
            type="search"
            placeholder="搜索端口 / 名称 / 进程…"
            class="w-64 pl-9 pr-3 py-2 rounded-lg bg-white/70 dark:bg-ink-900/60 border border-ink-200 dark:border-ink-700 text-sm placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-400"
          />
          <svg class="absolute left-2.5 top-2.5 w-4 h-4 text-ink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>

        <label class="flex items-center gap-2 text-xs text-ink-500 dark:text-ink-400 px-3 py-2 rounded-lg bg-white/70 dark:bg-ink-900/60 border border-ink-200 dark:border-ink-700 cursor-pointer">
          <input type="checkbox" x-model="autoRefresh" class="accent-indigo-500" />
          自动刷新
        </label>

        <button
          @click="refresh(true)"
          :disabled="loading"
          class="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5 shadow-sm shadow-indigo-500/30"
        >
          <svg class="w-4 h-4" :class="loading && 'animate-spin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
          立即刷新
        </button>
      </div>
    </header>

    <!-- Stats -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
      <template x-for="stat in stats" :key="stat.label">
        <div class="card rounded-xl px-4 py-3">
          <div class="text-xs tracking-wide text-ink-500 dark:text-ink-400" x-text="stat.label"></div>
          <div class="text-2xl font-bold mt-1" :class="stat.color" x-text="stat.value"></div>
        </div>
      </template>
    </section>

    <!-- Loading skeleton -->
    <template x-if="loading && !data">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="i in 6" :key="i">
          <div class="card rounded-xl p-5 animate-pulse">
            <div class="h-4 w-24 bg-ink-200 dark:bg-ink-700 rounded mb-3"></div>
            <div class="h-3 w-40 bg-ink-200 dark:bg-ink-700 rounded mb-2"></div>
            <div class="h-3 w-32 bg-ink-200 dark:bg-ink-700 rounded"></div>
          </div>
        </template>
      </div>
    </template>

    <!-- User services -->
    <template x-if="data">
      <section class="animate-fade-in">
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="text-sm font-semibold tracking-wider text-ink-600 dark:text-ink-300">
            我的服务
            <span class="ml-1 text-ink-400" x-text="`(${filteredUser.length})`"></span>
          </h2>
        </div>

        <template x-if="filteredUser.length === 0">
          <div class="card rounded-xl p-8 text-center text-ink-500 dark:text-ink-400">
            <div class="text-4xl mb-2">🌊</div>
            <div class="text-sm" x-text="query ? '没有匹配的服务' : '当前没有用户服务在运行'"></div>
          </div>
        </template>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <template x-for="svc in filteredUser" :key="svc.port + ':' + svc.pid">
            <a
              :href="svc.url"
              :target="svc.is_http ? '_blank' : '_self'"
              :rel="svc.is_http ? 'noopener noreferrer' : ''"
              @click="if (!svc.is_http) $event.preventDefault()"
              class="card rounded-xl p-5 block group"
              :class="!svc.is_http && 'cursor-default'"
            >
              <div class="flex items-start justify-between gap-2 mb-3">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="status-dot animate-pulse-soft" :class="`status-${svc.status}`"></span>
                  <span class="font-mono text-sm font-semibold text-indigo-600 dark:text-indigo-400">
                    :<span x-text="svc.port"></span>
                  </span>
                  <span x-show="svc.scheme === 'https'" class="text-xs text-emerald-600 dark:text-emerald-400">🔒</span>
                </div>
                <span
                  class="text-[10px] font-medium px-1.5 py-0.5 rounded tracking-wide"
                  :class="{
                    'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300': svc.status === 'running',
                    'bg-amber-50 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300': svc.status === 'non-http',
                    'bg-red-50 text-red-700 dark:bg-red-900/40 dark:text-red-300': svc.status === 'unreachable',
                    'bg-ink-100 text-ink-600 dark:bg-ink-800 dark:text-ink-300': svc.status === 'unknown',
                  }"
                  x-text="statusLabel(svc.status)"
                ></span>
              </div>

              <h3 class="font-semibold text-base text-ink-900 dark:text-ink-50 truncate" x-text="svc.display_name"></h3>

              <div class="mt-2 space-y-1 text-xs text-ink-500 dark:text-ink-400">
                <div class="flex items-center gap-1.5 truncate" x-show="svc.process_name">
                  <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/></svg>
                  <span class="font-mono truncate" x-text="svc.process_name"></span>
                  <span class="text-ink-400" x-text="`· PID ${svc.pid}`"></span>
                </div>
                <div class="flex items-center gap-1.5 truncate" x-show="svc.cwd" :title="svc.cwd">
                  <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                  <span class="truncate font-mono" x-text="shortPath(svc.cwd)"></span>
                </div>
              </div>

              <div class="mt-3 pt-3 border-t border-ink-200/60 dark:border-ink-700/60 flex items-center justify-between text-xs">
                <span class="font-mono text-ink-400" x-text="svc.url"></span>
                <span x-show="svc.is_http" class="text-indigo-600 dark:text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 font-medium">
                  打开
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
                </span>
              </div>
            </a>
          </template>
        </div>
      </section>
    </template>

    <!-- System services (collapsible) -->
    <template x-if="data && filteredSystem.length">
      <section class="mt-10 animate-fade-in">
        <button @click="showSystem = !showSystem" class="flex items-center gap-2 text-sm font-semibold tracking-wider text-ink-500 dark:text-ink-400 hover:text-ink-700 dark:hover:text-ink-200">
          <svg class="w-4 h-4 transition-transform" :class="showSystem && 'rotate-90'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          系统服务
          <span class="text-ink-400" x-text="`(${filteredSystem.length})`"></span>
        </button>

        <div x-show="showSystem" x-cloak class="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <template x-for="svc in filteredSystem" :key="svc.port + ':' + svc.pid">
            <div class="card rounded-lg p-3 opacity-80 hover:opacity-100">
              <div class="flex items-center gap-2 text-sm">
                <span class="status-dot" :class="`status-${svc.status}`"></span>
                <span class="font-mono text-ink-600 dark:text-ink-300">:<span x-text="svc.port"></span></span>
                <span class="text-ink-500 dark:text-ink-400 truncate" x-text="svc.process_name || '未知进程'"></span>
              </div>
            </div>
          </template>
        </div>
      </section>
    </template>

    <!-- Footer -->
    <footer class="mt-16 pt-6 border-t border-ink-200/60 dark:border-ink-700/40 flex items-center justify-between text-xs text-ink-400">
      <span>
        PortPilot <span x-text="data ? 'v' + data.version : ''"></span> ·
        <a href="/api/docs" class="hover:text-indigo-500">API 文档</a>
      </span>
      <span x-show="data" x-text="`更新于 ${formatTime(data.generated_at)}`"></span>
    </footer>
  </div>

  <script>
    function dashboard() {
      return {
        data: null,
        loading: false,
        query: '',
        autoRefresh: true,
        showSystem: false,
        _timer: null,

        get stats() {
          const s = this.data?.summary || { total: 0, user: 0, system: 0, running: 0 };
          return [
            { label: '全部端口', value: s.total,   color: 'text-ink-900 dark:text-ink-50' },
            { label: '运行中',   value: s.running, color: 'text-emerald-600 dark:text-emerald-400' },
            { label: '我的服务', value: s.user,    color: 'text-indigo-600 dark:text-indigo-400' },
            { label: '系统服务', value: s.system,  color: 'text-ink-500 dark:text-ink-400' },
          ];
        },

        statusLabel(status) {
          return ({
            'running': '运行中',
            'non-http': '非 HTTP',
            'unreachable': '不可达',
            'unknown': '未知',
          })[status] || status;
        },

        get filteredUser()   { return this._filter(this.data?.user_services); },
        get filteredSystem() { return this._filter(this.data?.system_services); },

        _filter(list) {
          if (!list) return [];
          const q = this.query.trim().toLowerCase();
          if (!q) return list;
          return list.filter(s =>
            String(s.port).includes(q) ||
            (s.display_name || '').toLowerCase().includes(q) ||
            (s.process_name || '').toLowerCase().includes(q) ||
            (s.title || '').toLowerCase().includes(q) ||
            (s.cwd || '').toLowerCase().includes(q)
          );
        },

        async init() {
          await this.refresh();
          this.$watch('autoRefresh', v => v ? this._startTimer() : this._stopTimer());
          if (this.autoRefresh) this._startTimer();
        },

        async refresh(force = false) {
          this.loading = true;
          try {
            const url = force ? '/api/services?refresh=true' : '/api/services';
            const resp = await fetch(url, { cache: 'no-store' });
            if (resp.ok) this.data = await resp.json();
          } catch (e) {
            console.error('refresh failed', e);
          } finally {
            this.loading = false;
          }
        },

        _startTimer() {
          this._stopTimer();
          this._timer = setInterval(() => this.refresh(), 30_000);
        },
        _stopTimer() { if (this._timer) clearInterval(this._timer); this._timer = null; },

        shortPath(p) {
          if (!p) return '';
          const home = '/Users/';
          if (p.startsWith(home)) {
            const rest = p.slice(home.length);
            const slash = rest.indexOf('/');
            if (slash > 0) return '~/' + rest.slice(slash + 1);
          }
          return p.length > 50 ? '…' + p.slice(-49) : p;
        },

        formatTime(ts) {
          if (!ts) return '';
          const d = new Date(ts * 1000);
          return d.toLocaleTimeString('zh-CN', { hour12: false });
        },
      };
    }
  </script>
</body>
</html>
